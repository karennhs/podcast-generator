name: "Podcast Generator"
author: "Karen H"
description: "Generates a podcast feed using the feed.py script."
runs:
  using: "docker"
  image: "Dockerfile"
branding:
  icon: "git-branch"
  color: "red"
inputs:
  email:
    description: "Email address for the Git user"
    required: true
    default: ${{ github.actor }}@localhost
  name:
    description: "Name for the Git user"
    required: true
    default: ${{ github.actor }}